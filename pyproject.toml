[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessguard"
version = "0.1.1"
description = "Vendor-neutral security and privacy auditing toolkit for AI IDEs, coding agents, extensions, and harnesses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "David" }]
keywords = ["security","privacy","ai-security","llm-security","static-analysis","runtime-analysis","pentesting","developer-tools","code-security","supply-chain-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
runtime = ["psutil>=5.9"]
dev = ["pytest>=8.0","pytest-cov>=5.0","ruff>=0.6","mypy>=1.10"]

[project.scripts]
harnessguard = "harnessguard.cli:main"

[project.urls]
Homepage = "https://github.com/cbk914/HarnessGuard"
Repository = "https://github.com/cbk914/HarnessGuard"
Issues = "https://github.com/cbk914/HarnessGuard/issues"

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
include = ["harnessguard*"]
[tool.ruff]
line-length = 100
target-version = "py39"
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
